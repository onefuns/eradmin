    body{background:#fff;font-size:13px}.top{height:50px;background:#f8f8f8;color:#555;border-bottom:1px solid #e5e5e5;padding:0 20px}.brand{font-size:14px;font-weight:normal}.brand small{color:#888}.version{color:#777;border-color:#ccc;background:#fff}.top select{border-color:#ccc}.top button{background:#fff;border-color:#ccc;color:#555}.shell{grid-template-columns:190px 1fr;min-height:calc(100vh - 50px)}.side{background:#f7f7f7;border-right:1px solid #ddd}.side-title{background:#eee;color:#444;border-bottom-color:#ddd}.group-title{background:#e9e9e9;color:#666;padding:9px 14px}.nav-btn{background:#f8f8f8;padding:10px 15px}.nav-btn:hover{background:#eee}.nav-btn.active{background:#337ab7;color:#fff;border-left:0;padding-left:15px}.crumb{height:42px;background:#fafafa;border-bottom-color:#e5e5e5;padding:0 20px}.content{padding:18px 22px}.page-head{margin-bottom:15px}.page-head h1{font-size:24px;font-weight:500}.page-head .sub{color:#999}.panel{border:1px solid #ddd;border-radius:4px;box-shadow:0 1px 1px rgba(0,0,0,.04)}.panel-title{padding:11px 14px;background:#fafafa;border-radius:4px 4px 0 0}.panel-body{padding:15px}.field label{color:#333;margin-bottom:6px}.field input,.field select{height:34px;border-color:#ccc;border-radius:3px;padding:6px 9px}.field textarea{border-color:#ccc;border-radius:3px;padding:8px}.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:#66afe9;box-shadow:0 0 0 2px rgba(102,175,233,.16)}.field input[readonly],.field textarea[readonly]{background:#f7f7f7;color:#666}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 13px;border-radius:3px;font-weight:500;line-height:1;white-space:nowrap;vertical-align:middle;box-shadow:0 1px 1px rgba(0,0,0,.05)}.btn.sm{min-height:26px;padding:0 9px;font-size:11px}.actions{gap:6px}.toolbar .btn{min-height:30px}.toolbar select{height:30px;border:1px solid #bbb;border-radius:3px;padding:0 8px}.table-wrap{border:1px solid #d5d5d5;border-rad <body>
  <header class="top">
    <div class="brand">티워드 무선라우터판매 관리 <small>기존 관리자 확장 프리뷰</small><span class="version">v4.2.0-preview.1</span></div>
    <div class="top-right">
      <select id="role"><option value="agency">대리점 관리자</option><option value="seller">판매점 관리자</option><option value="dealer">영업점 관리자</option></select>
      <span id="orgName">본사 대리점</span><button onclick="toast('로그아웃 버튼 예시입니다.')">로그아웃</button>
    </div>
  </header>
  <div class="shell">
    <aside class="side"><div class="side-title" id="sideTitle">대리점 메뉴</div><nav id="nav"></nav></aside>
    <main class="main"><div class="crumb">HOME &gt; <span id="crumb" style="margin-left:5px">재고 관리</span></div><section class="content" id="content"></section></main>
  </div>
  <div id="modalRoot"></div><div id="toast" class="toast"></div>
<script>
const state={role:'agency',page:'stock'};
const roleNames={agency:'본사 대리점',seller:'DAS 판매점',dealer:'강남 영업점'};
const LEGACY_ORDER_STATES=['접수중','배송준비중','탁송중','배송완료','주문취소','주문보류','예약'];
const LEGACY_CHARGE_STATES=['접수중','충전중','충전완료','예약중','신규개통','충전보류','유심 선발송','미충전발송','미개통발송'];
const STORE_PAYMENT_STATES=['결제확인대기','결제완료','환불대기','환불완료','환불불필요'];
const menus={
 agency:[{g:'업무 관리',i:[['stock','재고 관리'],['orders','신규 주문 요청'],['chargeOrders','충전 주문 요청'],['saleManage','판매 관리'],['saleStatus','판매 현황'],['chargeHistory','충전내역 및 예약현황'],['settlement','정산 관리'],['board','자유 게시판'],['profile','개인정보 수정']]},{g:'관리',i:[['codes','코드 관리'],['users','사용자 관리'],['sellers','판매점 관리'],['carriers','통신사 관리'],['ip','접속IP 관리'],['logs','접속 로그']]}],
 seller:[{g:'업무 관리',i:[['home','판매현황 (충전, 신규주문)'],['orders','신규 주문 진행'],['chargeOrders','충전 주문 요청'],['chargeHistory','충전내역 및 예약현황'],['settlement','정산 정보'],['stock','재고 현황'],['board','자유 게시판'],['profile','개인정보 수정']]},{g:'영업점 관리',i:[['dealers','영업점 관리'],['supply','영업점 공급가 설정']]},{g:'쇼핑몰 관리',i:[['storeCategories','상품 분류'],['storeProducts','상품 판매 등록'],['storeDisplay','노출 순서 관리'],['customerOrders','고객 주문관리']]}],
 dealer:[{g:'업무 관리',i:[['home','판매현황 (충전, 신규주문)'],['orders','신규 주문 진행'],['chargeOrders','충전 주문 요청'],['chargeHistory','충전내역 및 예약현황'],['settlement','정산 정보'],['stock','재고 현황'],['board','자유 게시판'],['profile','개인정보 수정']]},{g:'쇼핑몰 관리',i:[['storeCategories','상품 분류'],['storeProducts','상품 판매 등록'],['storeDisplay','노출 순서 관리'],['customerOrders','고객 주문관리']]}]
};
function status(t,c='blue'){return `<span class="status s-${c}">${t}</span>`}
function pageHead(title,sub='',buttons=''){return `<div class="page-head"><h1>${title}</h1><span class="sub">${sub}</span><div class="actions">${buttons}</div></div>`}
function search(fields){return `<div class="search-panel"><div class="search-caption">검색</div><div class="search-grid">${fields}<div class="search-buttons"><button class="btn primary" onclick="toast('검색했습니다. (프리뷰)')">검색</button><button class="btn" onclick="toast('검색조건을 초기화했습니다.')">초기화</button></div></div></div>`}
function field(label,control,cls=''){return `<div class="field ${cls}"><label>${label}</label>${control}</div>`}
function input(ph=''){return `<input placeholder="${ph}">`}
function select(opts){return `<select>${opts.map(x=>`<option>${x}</option>`).join('')}</select>`}
function dates(label='신청일'){return field(label+' 시작','<input value="2026-10-01">')+field(label+' 종료','<input value="2026-10-26">')}
function table(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${i===0?'':'left'}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function check(){return '<input type="checkbox">'}
function btn(label,kind){return `<button class="btn sm" onclick="openForm('${kind}')">${label}</button>`}

function renderNav(){document.getElementById('sideTitle').textContent=state.role==='agency'?'대리점 메뉴':state.role==='seller'?'판매점 메뉴':'영업점 메뉴';document.getElementById('orgName').textContent=roleNames[state.role];document.getElementById('nav').innerHTML=menus[state.role].map(g=>`<div class="group"><div class="group-title">${g.g}</div>${g.i.map(m=>`<button class="nav-btn ${state.page===m[0]?'active':''} ${m[2]||''}" onclick="go('${m[0]}')">${m[1]}</button>`).join('')}</div>`).join('')}
function go(page){state.page=page;renderNav();renderPage()}

function stockPage(){const a=state.role==='agency';return pageHead(a?'재고 관리':'재고 현황',a?'기존 재고 등록에 판매점·영업점 귀속만 확장':'자기 조직에 할당된 재고 조회',a?'<button class="btn danger" onclick="toast(\'삭제 대상 선택이 필요합니다.\')">삭제</button><button class="btn primary" onclick="openForm(\'stock\')">재고 등록</button>':'')+
 search((a?field('재고상태',select(['재고상태 선택','재고','서비스중','유심해지','유심정지']))+field('판매조건',select(['판매조건 선택','판매','대여','선발송1','선발송0']))+field('판매점',select(['판매점 선택','DAS 판매점','서초 판매점']))+field('영업점',select(['영업점 선택','선택안함','강남 영업점','잠실 영업점'])):'')+field('검색어',input('CTN, USIM, Model, S/N-SSID-PASS'),a?'span2':'full'))+
 table([check(),'순번','CTN / USIM-Serial',...(a?['판매점','영업점']:[]),'Model','S/N-SSID-PASS','판매조건','상태'],[
 [check(),'43658','012-0129-9999<small>3333-33333333</small>',...(a?['DAS 판매점','강남 영업점']:[]),'K100W-KT결합','777777777777','판매',status('서비스중','green')],
 [check(),'43657','012-2202-3880<small>9700-03642182</small>',...(a?['미배정','-']:[]),'USIM(U+)','2기가','-',status('재고','blue')],
 [check(),'43656','012-2220-9784<small>9700-03642181</small>',...(a?['DAS 판매점','선택안함']:[]),'M200(U+)','076863-80865799','판매',status('서비스중','green')]]);}

function ordersPage(){const a=state.role==='agency',s=state.role==='seller';if(a)return pageHead('신규 주문 요청','기존 대리점 주문 처리 화면','<button class="btn" onclick="toast(\'엑셀 다운로드 예시입니다.\')">엑셀 다운로드</button><button class="btn primary" onclick="openForm(\'adminOrder\')">신규 주문 등록</button>')+

function accountForm(title){const orgLabel=title==='영업점'?'영업점명 *':'이름 / 조직명 *';const member=title==='영업점'?'<input value="영업점" readonly>':select(['관리자','판매점','영업점','통신사']);return [`${title==='영업점'?'영업점 개설·수정':title+' 등록·수정'}`,`<div class="section-label">로그인 정보</div>${field('아이디 *','<input placeholder="로그인 아이디">')}${field('비밀번호 *','<input type="password" placeholder="8자 이상 입력">')}<div class="section-label">기본 정보</div>${field(orgLabel,'<input placeholder="조직 또는 사용자 이름">')}${field('대표자명','<input placeholder="대표자명">')}${field('연락처','<input placeholder="010-0000-0000">')}${field('이메일','<input type="email" placeholder="name@example.com">')}<div class="section-label">운영 설정</div>${field('회원유형',member)}${field('상태',select(['정상','사용중지']))}${field('시작페이지',select(['판매현황','신규 주문 진행','충전 주문 요청','충전내역 및 예약현황','정산 정보','재고 현황']))}<div class="field full"><label>메뉴 권한</label><div class="permission-grid"><label><input type="checkbox" checked> 판매현황</label><label><input type="checkbox" checked> 신규주문</label><label><input type="checkbox" checked> 충전주문</label><label><input type="checkbox" checked> 충전내역</label><label><input type="checkbox" checked> 정산</label><label><input type="checkbox" checked> 재고현황</label><label><input type="checkbox" checked> 게시판</label><label><input type="checkbox" checked> 쇼핑몰관리</label></div></div><div class="form-help">필수항목과 메뉴 권한만 확인하면 등록할 수 있도록 기존 입력 순서를 유지했습니다.</div>`]}
function openForm(kind){state.activeForm=kind;let f=forms[kind];if(['users','sellers','carriers','dealers'].includes(kind))f=accountForm({users:'사용자',sellers:'판매점',carriers:'통신사',dealers:'영업점'}[kind]);if(!f)f=['상세 정보','<p>상세 화면 예시입니다.</p>'];document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head">${f[0]}<button onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid">${f[1]}</div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">취소</button> <button class="btn primary" onclick="saveForm()">저장</button></div></div></div>`}
const rechargePlanOptions=['5GCA200','KT5G30-165','KTR-C-85','KT30MCSIM'];
let rechargePlanRows=['5GCA200'];
function rechargePlanSelect(value,index){return `<select aria-label="${index+1}개월 요금제" onchange="setRechargePlan(${index},this.value)">${rechargePlanOptions.map(plan=>`<option ${plan===value?'selected':''}>${plan}</option>`).join('')}</select>`}
function renderRechargeRows(){const root=document.getElementById('rechargeRows');if(!root)return;root.innerHTML=rechargePlanRows.map((plan,index)=>`<div class="recharge-row"><label>${index+1}개월 요금제</label><div class="recharge-line">${rechargePlanSelect(plan,index)}<button type="button" class="btn add-plan" onclick="addRechargeRow(${index})">추가</button><button type="button" class="btn remove-plan" onclick="removeRechargeRow(${index})">제거</button></div></div>`).join('')}
function setRechargePlan(index,value){rechargePlanRows[index]=value}
function addRechargeRow(index){rechargePlanRows.splice(index+1,0,rechargePlanRows[index]||rechargePlanOptions[0]);renderRechargeRows()}
function removeRechargeRow(index){if(rechargePlanRows.length===1){toast('최소 1개월 요금제는 유지해야 합니다.');return}rechargePlanRows.splice(index,1);renderRechargeRows()}
function openRecharge(ctn,customer){rechargePlanRows=['5GCA200'];openForm('recharge');document.getElementById('rechargeCtn').value=ctn;renderRechargeRows()}
function openCustomerOrder(text){openForm('order');document.getElementById('orderText').value=text}
function openCustomerCancel(button){state.cancelRow=button.closest('tr');openForm('customerCancel')}
function moveOrder(direction){toast('노출 순서를 '+direction+'로 이동했습니다. (프리뷰)')}
function saveForm(){if(state.activeForm==='customerCancel'&&state.cancelRow){const orderState=state.cancelRow.querySelector('.customer-order-state');const paymentState=state.cancelRow.querySelector('.customer-payment-state');const manualState=state.cancelRow.querySelector('.customer-manual-state');const actions=state.cancelRow.querySelector('.customer-order-actions');if(orderState)orderState.innerHTML=status('주문취소','red');if(paymentState)paymentState.innerHTML=status('환불대기','orange');if(manualState)manualState.innerHTML=status('접수차단','gray');if(actions)actions.innerHTML='<button class="btn sm" onclick="openForm(\'customerOrder\')">주문 보기</button>';state.cancelRow=null;closeModal();toast('고객 주문을 주문취소·환불대기로 변경했습니다.');return}closeModal();toast('저장했습니다. (프리뷰)')}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t.timer);t.timer=setTimeout(()=>t.classList.remove('on'),2200)}
function sumSettle(){const s=[...document.querySelectorAll('.settle:checked')].reduce((n,x)=>n+Number(x.dataset.amt),0);const e=document.getElementById('selectedSum');if(e)e.textContent=s.toLocaleString('ko-KR')+'원'}
function settle(st){const n=document.querySelectorAll('.settle:checked').length;toast(n?`${n}건을 ${st} 처리했습니다. (프리뷰)`:'처리할 주문 건을 선택하세요.')}
document.getElementById('role').onchange=e=>{state.role=e.target.value;state.page=state.role==='agency'?'stock':'home';renderNav();renderPage();toast(roleNames[state.role]+' 화면으로 전환했습니다.')};
renderNav();renderPage();
