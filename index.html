    *{box-sizing:border-box}body{margin:0;background:#eef1f4;color:var(--text);font:12px Arial,"Malgun Gothic",sans-serif}button,input,select,textarea{font:inherit}.top{height:48px;background:var(--nav);color:#fff;display:flex;align-items:center;padding:0 18px;border-bottom:3px solid var(--blue)}.brand{font-size:16px;font-weight:bold}.brand small{font-size:10px;color:#b7c4d0;margin-left:8px}.version{display:inline-block;margin-left:8px;padding:2px 6px;border:1px solid #67809a;border-radius:2px;color:#dce8f2;font-size:10px;font-weight:normal}.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}.top select{height:28px;border:1px solid #172536;background:#fff;color:#333;padding:0 8px}.top button{height:28px;background:#3d5267;border:1px solid #52677c;color:#fff;padding:0 10px;cursor:pointer}.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 48px)}.side{background:#fff;border-right:1px solid #cfd6dd}.side-title{padding:13px 14px;background:#f4f6f8;border-bottom:1px solid var(--line);font-weight:bold;color:#4b5d6f}.group{border-bottom:1px solid var(--line)}.group-title{padding:8px 13px;background:#fafafa;color:#888;font-size:11px;font-weight:bold}.nav-btn{display:block;width:100%;border:0;border-top:1px solid #f1f1f1;background:#fff;text-align:left;padding:9px 14px;color:#444;cursor:pointer}.nav-btn:hover{background:#f4f8fb}.nav-btn.active{background:#e7f1f9;color:#1b5f91;font-weight:bold;border-left:3px solid var(--blue);padding-left:11px}.nav-btn.review{color:#7b61a8}.main{min-width:0}.crumb{height:38px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;color:#777}.content{padding:14px}.page-head{display:flex;align-items:center;margin-bottom:10px}.page-head h1{font-size:18px;margin:0}.page-head .sub{color:#888;margin-left:10px}.actions{margin-left:auto;display:flex;gap:5px}.btn{border:1px solid #ccc;background:#fff;color:#333;padding:5px 10px;border-radius:2px;cursor:pointer}.btn:hover{background:#eee}.btn.primary{color:#fff;background:var(--blue);border-color:var(--blue2)}.btn.danger{color:#fff;background:var(--red);border-color:#c9302c}.btn.success{color:#fff;background:var(--green);border-color:#4cae4c}.btn.sm{padding:3px 7px;font-size:11px}.panel{background:#fff;border:1px solid #cfd6dd;margin-bottom:12px}.panel-title{padding:9px 12px;background:#f5f5f5;border-bottom:1px solid #ddd;font-weight:bold}.panel-body{padding:10px}.search-grid{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:7px;align-items:end}.field label{display:block;color:#666;margin-bottom:4px;font-weight:bold}.field input,.field select,.field textarea{width:100%;height:28px;border:1px solid #bbb;padding:4px 6px;background:#fff}.field textarea{height:68px;resize:vertical}.field.span2{grid-column:span 2}.field.full{grid-column:1/-1}.search-buttons{display:flex;gap:5px}.summary{display:flex;gap:20px;padding:8px 10px;background:#fffbe9;border:1px solid #eadfa8;margin-bottom:10px}.summary strong{color:#c43}.table-wrap{overflow:auto;background:#fff;border:1px solid #cfd6dd}.table{border-collapse:collapse;width:100%;min-width:1050px}.table th{background:#f2f2f2;border:1px solid #d6d6d6;padding:7px 6px;text-align:center;white-space:nowrap}.table td{border:1px solid #ddd;padding:6px;text-align:center;white-space:nowrap}.table tbody tr:nth-child(even){background:#fafafa}.table tbody tr:hover{background:#eef7ff}.table td.left{text-align:left}.table small{display:block;color:#888;margin-top:2px}.status{display:inline-block;border-radius:2px;padding:2px 5px;color:#fff;font-size:10px}.s-blue{background:var(--blue)}.s-green{background:var(--green)}.s-orange{background:var(--orange)}.s-red{background:var(--red)}.s-gray{background:#888}.toolbar{display:flex;align-items:center;gap:5px;margin:8px 0}.toolbar .right{margin-left:auto}.notice{border:1px solid #bce8f1;background:#d9edf7;color:#31708f;padding:9px 11px;margin-bottom:10px}.review-box{border-left:4px solid #8b6bb1;background:#f7f3fb;padding:10px;margin-bottom:10px}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:60px 15px;z-index:100}.modal{width:min(820px,100%);max-height:85vh;overflow:auto;background:#fff;border:1px solid #555;box-shadow:0 5px 20px rgba(0,0,0,.35)}.modal-head{background:#f5f5f5;border-bottom:1px solid #ddd;padding:10px 12px;display:flex;align-items:center;font-weight:bold;font-size:14px}.modal-head button{margin-left:auto;border:0;background:none;font-size:18px;cursor:pointer}.modal-body{padding:12px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 12px}.section-label{grid-column:1/-1;background:#f5f5f5;border:1px solid #ddd;padding:7px;font-weight:bold;margin-top:3px}.modal-foot{border-top:1px solid #ddd;background:#f7f7f7;padding:9px 12px;text-align:right}.toast{position:fixed;right:20px;bottom:20px;background:#333;color:#fff;padding:9px 13px;opacity:0;transform:translateY(8px);transition:.2s;z-index:200}.toast.on{opacity:1;transform:none}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static}.search-grid{grid-template-columns:repeat(2,1fr)}.top{height:auto;min-height:48px;flex-wrap:wrap;padding:8px}.content{padding:8px}.form-grid{grid-template-columns:1fr}}

<body>
  <header class="top">
    <div class="brand">티워드 무선라우터판매 관리 <small>신규 관리자 프리뷰</small><span class="version">v3.1.0-preview.1</span></div>
    <div class="top-right">
      <select id="role"><option value="agency">대리점 관리자</option><option value="seller">판매점 관리자</option><option value="dealer">영업점 관리자</option></select>
      <span id="orgName">본사 대리점</span><button onclick="toast('로그아웃 버튼 예시입니다.')">로그아웃</button>
    </div>
  </header>
  <div class="shell">
    <aside class="side"><div class="side-title" id="sideTitle">대리점 메뉴</div><nav id="nav"></nav></aside>
    <main class="main"><div class="crumb">HOME &gt; <span id="crumb" style="margin-left:5px">재고 관리</span></div><section class="content" id="content"></section></main>
  </div>
  <div id="modalRoot"></div><div id="toast" class="toast"></div>
<script>
const state={role:'agency',page:'stock'};
const roleNames={agency:'본사 대리점',seller:'DAS 판매점',dealer:'강남 영업점'};
const menus={
 agency:[{g:'업무 관리',i:[['stock','재고 관리'],['orders','신규 주문 요청'],['saleManage','판매 관리'],['saleStatus','판매 현황'],['chargeHistory','충전내역 및 예약현황'],['settlement','정산 관리'],['board','자유 게시판'],['profile','개인정보 수정']]},{g:'관리',i:[['codes','코드 관리'],['users','사용자 관리'],['sellers','판매점 관리'],['carriers','통신사 관리'],['ip','접속IP 관리'],['logs','접속 로그']]}],
 seller:[{g:'업무 관리',i:[['home','판매현황 (충전, 신규주문)'],['orders','신규 주문 진행'],['chargeHistory','충전내역 및 예약현황'],['settlement','정산 정보'],['stock','재고 현황'],['board','자유 게시판'],['profile','개인정보 수정']]},{g:'영업점 관리',i:[['dealers','영업점 관리'],['supply','영업점 공급가 설정']]},{g:'쇼핑몰 관리',i:[['storeCategories','상품 분류'],['storeProducts','상품 판매 등록'],['storeDisplay','노출 순서 관리'],['customerOrders','고객 주문관리']]}],
 dealer:[{g:'업무 관리',i:[['home','판매현황 (충전, 신규주문)'],['orders','신규 주문 진행'],['chargeHistory','충전내역 및 예약현황'],['settlement','정산 정보'],['stock','재고 현황'],['board','자유 게시판'],['profile','개인정보 수정']]},{g:'쇼핑몰 관리',i:[['storeCategories','상품 분류'],['storeProducts','상품 판매 등록'],['storeDisplay','노출 순서 관리'],['customerOrders','고객 주문관리']]}]
};
function status(t,c='blue'){return `<span class="status s-${c}">${t}</span>`}
function pageHead(title,sub='',buttons=''){return `<div class="page-head"><h1>${title}</h1><span class="sub">${sub}</span><div class="actions">${buttons}</div></div>`}
function search(fields){return `<div class="panel"><div class="panel-title">검색 조건</div><div class="panel-body"><div class="search-grid">${fields}<div class="search-buttons"><button class="btn primary" onclick="toast('검색했습니다. (프리뷰)')">검색</button><button class="btn" onclick="toast('검색조건을 초기화했습니다.')">초기화</button></div></div></div></div>`}
function field(label,control,cls=''){return `<div class="field ${cls}"><label>${label}</label>${control}</div>`}
function input(ph=''){return `<input placeholder="${ph}">`}
function select(opts){return `<select>${opts.map(x=>`<option>${x}</option>`).join('')}</select>`}
function dates(label='신청일'){return field(label+' 시작','<input value="2026-10-01">')+field(label+' 종료','<input value="2026-10-26">')}
function table(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${i===0?'':'left'}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function check(){return '<input type="checkbox">'}
function btn(label,kind){return `<button class="btn sm" onclick="openForm('${kind}')">${label}</button>`}

function renderNav(){document.getElementById('sideTitle').textContent=state.role==='agency'?'대리점 메뉴':state.role==='seller'?'판매점 메뉴':'영업점 메뉴';document.getElementById('orgName').textContent=roleNames[state.role];document.getElementById('nav').innerHTML=menus[state.role].map(g=>`<div class="group"><div class="group-title">${g.g}</div>${g.i.map(m=>`<button class="nav-btn ${state.page===m[0]?'active':''} ${m[2]||''}" onclick="go('${m[0]}')">${m[1]}</button>`).join('')}</div>`).join('')}
function go(page){state.page=page;renderNav();renderPage()}

function stockPage(){const a=state.role==='agency';return pageHead(a?'재고 관리':'재고 현황',a?'재고 등록·수정·판매점 배정':'배정 또는 판매 매칭된 재고 조회',a?'<button class="btn danger" onclick="toast(\'삭제 대상 선택이 필요합니다.\')">선택 삭제</button><button class="btn primary" onclick="openForm(\'stock\')">신규 재고 등록 및 수정</button>':'<button class="btn" onclick="toast(\'엑셀 다운로드 예시입니다.\')">엑셀 다운로드</button>')+
 search((a?field('재고 상태',select(['전체','재고','서비스중','USIM해지','USIM정지']))+field('판매 조건',select(['전체','판매','대여','선발송']))+field('판매점',select(['전체','DAS 판매점','서초 판매점'])):'')+field('통합 검색',input('CTN, USIM, Model, S/N, SSID, 고객'),a?'span2':'full'))+
 table([check(),'번호','입고일','CTN / USIM-Serial',...(a?['판매점']:[]),'Model / S/N-SSID-PASS','판매조건','상태','관리'],[
 [check(),'43558','2026-10-12','012-****-4921<small>8982-****-0471</small>',...(a?['DAS 판매점']:[]),'MXR-5G AX<small>A08F-****-91 / ROAM491 / ******</small>','판매',status('서비스중','green'),a?btn('수정','stock'):'-'],
 [check(),'43557','2026-10-10','012-****-8814<small>8982-****-2217</small>',...(a?['미배정']:[]),'JT201<small>J21K-****-14 / EGG814 / ******</small>','판매',status('재고','blue'),a?btn('수정','stock'):'-'],
 [check(),'43556','2026-10-08','012-****-3044<small>8982-****-9081</small>',...(a?['DAS 판매점']:[]),'K100W<small>K10W-****-61 / K100304 / ******</small>','대여',status('서비스중','green'),a?btn('수정','stock'):'-']]);}

function ordersPage(){const a=state.role==='agency',s=state.role==='seller';if(a)return pageHead('신규 주문 요청','기존 대리점 주문 처리 화면','<button class="btn" onclick="toast(\'엑셀 다운로드 예시입니다.\')">엑셀 다운로드</button><button class="btn primary" onclick="openForm(\'adminOrder\')">신규 주문 등록</button>')+

 `<div class="toolbar"><select><option>접수중</option><option>배송준비중</option><option>탁송중</option><option>배송완료</option><option>주문취소</option><option>주문보류</option><option>예약</option></select><button class="btn primary" onclick="toast('선택 주문 상태를 변경했습니다. (프리뷰)')">선택 상태변경</button><button class="btn danger" onclick="toast('선택 항목이 없습니다.')">선택 삭제</button></div>`+
 table([check(),'판매점','순번','신청일','신청구분','요청내용','상태','개통일','처리메모','관리'],[[check(),'DAS 판매점','10284','2026-10-28','신규','KT / MXR-5G AX / 1대 / 김민수',select(['접수중','배송준비중','탁송중','배송완료','주문취소','주문보류','예약']),'<input value="" style="width:90px">','<input value="결제 확인 완료" style="width:130px">','<button class="btn sm primary" onclick="toast(\'행 정보를 저장했습니다.\')">저장</button> '+btn('상세','orderDetail')],[check(),'DAS 판매점','10283','2026-10-27','신규','KT 5G eSIM 단독 / 1개 / 이서준',select(['배송준비중','접수중','탁송중','배송완료','주문취소','주문보류','예약']),'<input value="" style="width:90px">','<input value="QR 발송 예정" style="width:130px">','<button class="btn sm primary" onclick="toast(\'행 정보를 저장했습니다.\')">저장</button> '+btn('상세','orderDetail')],[check(),'서초 판매점','10281','2026-10-26','신규','K100W / 1대 / 정도윤',select(['탁송중','접수중','배송준비중','배송완료','주문취소','주문보류','예약']),'<input value="2026-10-27" style="width:90px">','<input value="CJ 6890-****" style="width:130px">','<button class="btn sm primary" onclick="toast(\'행 정보를 저장했습니다.\')">저장</button> '+btn('상세','orderDetail')]]);
 const orgFilter=s?field('요청 조직',select(['전체','DAS 판매점 직접','강남 영업점','잠실 영업점'])):'';const notice=s?'영업점 요청은 판매점이 확인 후 승인·대리점 요청합니다. 판매점 직접 주문은 바로 대리점에 요청합니다.':'작성한 주문은 판매점에 요청하고 판매점 승인 후 대리점으로 전달됩니다.';return pageHead('신규 주문 진행','기존 판매점 주문 목록 UI를 유지한 상위 요청 처리','<button class="btn" onclick="toast(\'엑셀 다운로드 예시입니다.\')">엑셀 다운로드</button>')+
 `<div class="notice">${notice}</div>`+search(orgFilter+field('주문 상태',select(['전체','작성중','상위 검토중','대리점 요청완료','접수중','배송준비중','탁송중','배송완료','주문취소','주문보류','예약']))+dates()+field('통합 검색',input('CTN, 고객명, 연락처'),s?'span2':'full'))+

 ['DAS 판매점 직접','10290','2026-10-28','신규','KT / MXR-5G AX / 1대 / 최유진',status('작성중','gray'),'-','-','직접 주문','<button class="btn sm" onclick="openForm(\'orderDetail\')">상세</button> <button class="btn sm primary" onclick="toast(\'대리점에 주문을 요청했습니다.\')">대리점 요청</button> <button class="btn sm danger" onclick="toast(\'요청을 취소했습니다.\')">취소</button>'],
 ['강남 영업점','10289','2026-10-28','신규','SKT / K100W / 1대 / 한지우',status('판매점 검토중','orange'),'-','-','영업점 요청','<button class="btn sm" onclick="openForm(\'orderDetail\')">상세</button> <button class="btn sm primary" onclick="toast(\'승인 후 대리점에 요청했습니다.\')">승인·대리점 요청</button> <button class="btn sm danger" onclick="openForm(\'orderReject\')">반려</button>'],

function openForm(kind){state.activeForm=kind;let f=forms[kind];if(['users','sellers','carriers','dealers'].includes(kind))f=accountForm({users:'사용자',sellers:'판매점',carriers:'통신사',dealers:'영업점'}[kind]);if(!f)f=['상세 정보','<p>상세 화면 예시입니다.</p>'];document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head">${f[0]}<button onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid">${f[1]}</div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">취소</button> <button class="btn primary" onclick="saveForm()">저장</button></div></div></div>`}
function openRecharge(ctn,customer){openForm('recharge');document.getElementById('rechargeCtn').value=ctn;document.getElementById('rechargeCustomer').value=customer}
function openCustomerOrder(text){openForm('order');document.getElementById('orderText').value=text}
function moveOrder(direction){toast('노출 순서를 '+direction+'로 이동했습니다. (프리뷰)')}
function saveForm(){closeModal();toast('저장했습니다. (프리뷰)')}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t.timer);t.timer=setTimeout(()=>t.classList.remove('on'),2200)}
function sumSettle(){const s=[...document.querySelectorAll('.settle:checked')].reduce((n,x)=>n+Number(x.dataset.amt),0);const e=document.getElementById('selectedSum');if(e)e.textContent=s.toLocaleString('ko-KR')+'원'}
function settle(st){const n=document.querySelectorAll('.settle:checked').length;toast(n?`${n}건을 ${st} 처리했습니다. (프리뷰)`:'처리할 주문 건을 선택하세요.')}
document.getElementById('role').onchange=e=>{state.role=e.target.value;state.page=state.role==='agency'?'stock':'home';renderNav();renderPage();toast(roleNames[state.role]+' 화면으로 전환했습니다.')};
renderNav();renderPage();
</script>
</body>
</html>
